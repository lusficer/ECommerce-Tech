# P6Spy Configuration File
modulelist=com.p6spy.engine.spy.P6SpyFactory,com.p6spy.engine.logging.P6LogFactory

# Set the appender to use for logging
appender=com.p6spy.engine.spy.appender.StdoutLogger

# Basic log format
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(currentTime)|%(executionTime)|%(category)|%(sqlSingleLine)

# Log all statements
filter=false
exclude=false

# Real JDBC driver
driverlist=com.mysql.cj.jdbc.Driver

# Keep it simple
autoflush=true
dateformat=yyyy-MM-dd HH:mm:ss
databaseDialectTimestampFormat=yyyy-MM-dd HH:mm:ss
logfile=
reloadproperties=false
useprefix=false

# Print SQL with proper line breaks and formatting
multiline=true

# Print stack traces for SQL taking longer than this threshold (ms)
executionThreshold=1000

# Specify the appender to use for logging
appender=com.p6spy.engine.spy.appender.StdoutLogger
#appender=com.p6spy.engine.spy.appender.FileLogger
#logfile=spy.log

# Use logging for Log4J
#appender=com.p6spy.engine.spy.appender.Log4jLogger
#log4j.appender.spy=org.apache.log4j.FileAppender
#log4j.appender.spy.File=spy.log
#log4j.appender.spy.layout=org.apache.log4j.PatternLayout
#log4j.appender.spy.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %m%n

# Exclude categories of SQL statements to log
excludecategories=info,debug,result,resultset,batch,commit,rollback

# Date format for logging
dateformat=yyyy-MM-dd HH:mm:ss.SSS

# Real JDBC driver to use
driverlist=com.mysql.cj.jdbc.Driver

# Custom filters for parameter logging
filter=true